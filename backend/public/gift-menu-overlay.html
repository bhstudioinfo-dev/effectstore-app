.gmd-canvas-wrap {

}
.gmd-canvas-header {

}

}

}
.gmd-ratios .gmd-btn {
    padding: 6px 10px;
    font-size: 12px;

}
.gmd-ratios .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));

}
.gmd-canvas-tools .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));
    border-color: rgba(192, 132, 252, 0.75);
}

.gmd-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background-color: #0b1326;
    background-image:
        linear-gradient(45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;

}
.gmd-canvas.is-zoomed { cursor: default; }
.gmd-canvas.is-zoomed.is-pan-mode { cursor: grab; }
.gmd-canvas.is-zoomed.is-panning { cursor: grabbing; }
.gmd-stage {
    position: absolute;
    inset: 0;

}
.gmd-guide {
    position: absolute;

}
.gmd-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.gmd-selected-card {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;

.gmd-selected-card img { width: 24px; height: 24px; object-fit: contain; }
.gmd-title-input {

.gmd-title-input:focus { outline: none; border-bottom-color: rgba(168,85,247,.85); }
.gmd-delete-btn {

.gmd-section {

}
.gmd-section h4 {

.gmd-inline-input {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    background: rgba(5,12,28,.9);
    overflow: hidden;
    box-sizing: border-box;
}
.gmd-inline-input input { border: 0; padding-left: 10px; }
.gmd-inline-input span {
    padding: 0 10px;
    color: #93a4ca;
    font-size: 12px;
    border-left: 1px solid rgba(255,255,255,.1);
}
.gmd-inline-input-single { max-width: 86px; margin-left: auto; }
.gmd-input-compact { padding: 7px 8px !important; font-size: 12px; background: transparent; }

.gmd-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.gmd-switch {
    width: 44px;
    height: 24px;
    position: relative;
    display: inline-block;
}
.gmd-switch input { display: none; }
.gmd-switch span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
    transition: .2s;
}
.gmd-switch span::after {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #fff;
    position: absolute;
    left: 3px;
    top: 3px;
    transition: .2s;
}
.gmd-switch input:checked + span { background: #7c3aed; }
.gmd-switch input:checked + span::after { transform: translateX(20px); }

.gmd-inline-color {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    gap: 6px;
    width: 100%;
    align-items: center;
}
.gmd-inline-color .gmd-color {
    padding: 0;
    height: 34px;
    border-radius: 10px;
    min-width: 0;
}

#gmd-inspector {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 3px;
}

#gmd-inspector .gmd-input,
#gmd-inspector .gmd-select,
#gmd-inspector .gmd-color,
#gmd-inspector .gmd-inline-input,
#gmd-inspector .gmd-inline-color {
    max-width: 100%;
}

#gmd-inspector::-webkit-scrollbar {
    width: 7px;
}

#gmd-inspector::-webkit-scrollbar-thumb {
    background: rgba(124, 58, 237, 0.45);
    border-radius: 8px;
}

.gmd-layer-list {
    display: grid;
    gap: 6px;
}
.gmd-layer-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    background: rgba(255,255,255,.02);
}
.gmd-layer-item.active {
    border-color: rgba(168,85,247,.7);
    box-shadow: 0 0 0 1px rgba(168,85,247,.2) inset;
}
.gmd-layer-main {
    display: grid;
    grid-template-columns: 22px 1fr;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: #e2e8f0;
    text-align: left;
    padding: 0;
    cursor: pointer;
    min-width: 0;
}
.gmd-layer-main img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}
.gmd-layer-main span {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.gmd-layer-actions {
    display: flex;
    gap: 4px;
}
.gmd-layer-btn {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(10,18,36,.9);
    color: #cbd5e1;
    font-size: 11px;
    cursor: pointer;
}
.gmd-layer-btn.off {
    color: #94a3b8;
    opacity: .7;
}

.gmd-item {
    position: absolute;
    display: block;
    align-items: center;
    user-select: none;
    transform-origin: center center;
    overflow: visible;
}
.gmd-visual {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}
.gmd-aura {
    position: absolute;
    inset: -9%;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
    z-index: 1;
    transform-style: preserve-3d;
    perspective: 600px;
    transform: scale(var(--aura-scale, 1));
    transform-origin: center center;
}
.gmd-aura-back { z-index: 1; }
.gmd-aura-front { z-index: 3; }
.gmd-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
}
.gmd-icon-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
}
.gmd-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
}
.gmd-aura::before,
.gmd-aura::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
}
/* Front glass disabled by default; enable selectively per aura type */
.gmd-aura-front { display: none; }
.gmd-aura-front::before,
.gmd-aura-front::after {
    inset: 0;
    background: transparent;
    border: 0;
    opacity: 0;
}
.aura-glow::before {
    inset: -7%;
    background: radial-gradient(circle at 50% 52%,
        color-mix(in srgb, var(--aura-color, #c084fc) 52%, transparent) 0%,
        color-mix(in srgb, var(--aura-color, #c084fc) 26%, transparent) 44%,
        transparent 80%);
    filter: blur(2.6px);
    opacity: .88;
    animation: gmdGlowPulse calc(var(--aura-speed, 1s) * 2.4) ease-in-out infinite;
    transform: translateZ(8px);
}
.aura-glow::after {
    inset: 4%;
    background:
        radial-gradient(circle at 34% 26%, rgba(255,255,255,.28), transparent 40%),
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--aura-color, #c084fc) 16%, transparent) 0%, transparent 72%);
    mix-blend-mode: screen;
    opacity: .7;
    transform: translateZ(12px);
}

        drop-shadow(0 0 44px color-mix(in srgb, var(--aura-color, #c084fc) 22%, transparent)) !important;
    }

    .gmd-export-item .aura-ring::before {
      border-width: 1.35px !important;
      box-shadow:
        0 0 10px color-mix(in srgb, var(--aura-color, #c084fc) 70%, transparent),
        0 0 24px color-mix(in srgb, var(--aura-color, #c084fc) 44%, transparent),
        inset 0 0 7px color-mix(in srgb, var(--aura-color, #c084fc) 32%, transparent) !important;
      filter: blur(.28px) saturate(1.08) !important;
      opacity: .96 !important;
    }

    .gmd-export-item .aura-ring::after {
      opacity: .9 !important;
      filter: blur(.4px) !important;
      box-shadow:
        0 0 10px color-mix(in srgb, var(--aura-color, #c084fc) 40%, transparent),
        inset 0 0 5px rgba(255,255,255,.2) !important;
    }

    .gmd-export-item .gmd-aura-front.aura-ring::before {
      opacity: .9 !important;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--aura-color, #c084fc) 58%, transparent)) !important;
    }

    .gmd-export-item .gmd-aura-front.aura-ring::after {
      opacity: .74 !important;
      filter: blur(.55px) !important;
    }

    .gmd-export-item .gmd-visual.aura-sweep .gmd-icon-wrap::after {
      filter: blur(.45px) brightness(1.1) !important;
      opacity: .92 !important;
    }

    .gmd-export-item .gmd-visual.aura-sweep .gmd-icon-wrap img {
      filter:
        saturate(1.06)
        drop-shadow(0 0 4px color-mix(in srgb, var(--aura-color, #c084fc) 40%, transparent))
        drop-shadow(0 0 10px color-mix(in srgb, var(--aura-color, #c084fc) 22%, transparent))
        drop-shadow(0 3px 8px rgba(0,0,0,.25)) !important;
    }

    .gmd-export-item .aura-fire::before {
      filter: blur(6.2px) saturate(1.12) brightness(1.04) !important;
      opacity: .76 !important;
    }

    .gmd-export-item .aura-fire::after {
      filter: blur(3.8px) saturate(1.08) !important;
      opacity: .5 !important;
    }

    .gmd-export-item .aura-electric::before {
      box-shadow:
        0 0 14px color-mix(in srgb, var(--aura-color, #53b8ff) 70%, transparent),
        0 0 30px color-mix(in srgb, var(--aura-color, #53b8ff) 44%, transparent),
        inset 0 0 16px color-mix(in srgb, var(--aura-color, #53b8ff) 28%, transparent) !important;
      filter: saturate(1.24) brightness(1.08) !important;
      opacity: .98 !important;
    }

    .gmd-export-item .aura-electric::after {
      filter: blur(.55px) drop-shadow(0 0 10px color-mix(in srgb, var(--aura-color, #53b8ff) 72%, transparent)) !important;
      opacity: .94 !important;
    }

    .gmd-export-item .gmd-aura-front.aura-electric::before {
      filter: blur(.3px) drop-shadow(0 0 12px color-mix(in srgb, var(--aura-color, #53b8ff) 78%, transparent)) !important;
      opacity: .9 !important;
    }

    .gmd-export-item .gmd-aura-front.aura-electric::after {
      filter: blur(2.3px) !important;
      opacity: .6 !important;
    }
  </style>
</head>
<body>
  <div id="overlay-root"></div>

  <script>
    const root = document.getElementById('overlay-root');
    let lastLayoutSignature = '';

    const auraMap = {
      Glow: 'aura-glow',
      Bubble: 'aura-bubble',
      'Magic Ring': 'aura-ring',
      'Neon Frame': 'aura-frame',
      'Light Sweep': 'aura-sweep',
      'Fire Aura': 'aura-fire',
      'Electric Aura': 'aura-electric'
    };

    const motionMap = {
      Pulse: 'anim-pulse',
      Bounce: 'anim-bounce',
      Float: 'anim-float',
      Zoom: 'anim-zoom',
      Shake: 'anim-shake'
    };

    function auraShapeVars(shape) {
      switch (shape) {
        case 'Square':
          return { radius: '14%', clip: 'none' };
        case 'Hexagon':
          return { radius: '0', clip: 'polygon(25% 6%, 75% 6%, 96% 50%, 75% 94%, 25% 94%, 4% 50%)' };
        case 'Star':
          return { radius: '0', clip: 'polygon(50% 0%, 62% 35%, 98% 35%, 69% 57%, 79% 91%, 50% 70%, 21% 91%, 31% 57%, 2% 35%, 38% 35%)' };
        case 'Oval':
          return { radius: '50% / 38%', clip: 'none' };
        case 'Circle':
        default:
          return { radius: '50%', clip: 'none' };
      }
    }

    function safeText(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function render(layout) {
      const items = Array.isArray(layout.exportedItems)
        ? layout.exportedItems
        : (Array.isArray(layout.items) ? layout.items : []);
      const exportW = Number(layout.exportSize && layout.exportSize.width) || 1080;
      const exportH = Number(layout.exportSize && layout.exportSize.height) || 1920;
      const sx = window.innerWidth / exportW;
      const sy = window.innerHeight / exportH;
      root.innerHTML = '';

      [...items]
        .filter((item) => item && item.visible !== false)
        .sort((a, b) => (Number(a.zIndex) || 0) - (Number(b.zIndex) || 0))
        .forEach((item) => {
          const auraClass = auraMap[item.auraType] || '';
          const motionClass = motionMap[item.animationType] || '';
          const shape = auraShapeVars(item.auraShape);
          const left = (Number(item.x) || 0) * sx;
          const top = (Number(item.y) || 0) * sy;
          const width = (Number(item.width) || 84) * sx;
          const height = (Number(item.height) || 84) * sy;
          const textSize = (Number(item.textSize) || 13) * ((sx + sy) / 2);
          const textGap = (Number(item.textGap) || 4) * sy;
          const auraSpeed = Math.max(0.2, Number(item.auraSpeed) || 1);
          const animSpeed = Math.max(0.2, Number(item.animationSpeed) || 1);
          const auraScale = Number(item.auraScale || 1);
          const iconUrl = item.iconUrl || '';
          const name = safeText(item.name || '');

          const el = document.createElement('div');
          el.className = 'gmd-item gmd-export-item';
          el.style.left = `${left}px`;
          el.style.top = `${top}px`;
          el.style.width = `${width}px`;
          el.style.height = `${height}px`;
          el.style.transform = `rotate(${Number(item.rotation) || 0}deg)`;
          el.style.zIndex = String(Number(item.zIndex) || 1);

          el.innerHTML = `
            <div class="gmd-visual ${motionClass} ${auraClass}"
              style="--aura-color:${item.auraColor || '#d7b2ff'};--aura-radius:${shape.radius};--aura-clip:${shape.clip};--anim-speed:${animSpeed}s;--aura-speed:${auraSpeed}s;--aura-scale:${auraScale};--icon-url:url('${iconUrl}');">
              <span class="gmd-aura gmd-aura-back ${auraClass}"></span>
              <span class="gmd-icon-wrap" style="--icon-url:url('${iconUrl}')">
                <img src="${iconUrl}" alt="${name}">
              </span>
              <span class="gmd-aura gmd-aura-front ${auraClass}"></span>
            </div>
            ${item.showName ? `<div class="gmd-item-label" style="font-size:${textSize}px;color:${item.textColor || '#f7cb64'};--label-gap:${textGap}px;">${name}</div>` : ''}
          `;
          root.appendChild(el);
        });
    }

    async function loadAndRender(force = false) {
      try {
        const res = await fetch(`/api/tiktok/gift-menu-layout?t=${Date.now()}`, { cache: 'no-store' });
        const data = await res.json();
        if (!(data && data.success && data.layout)) return;

        const layout = data.layout;
        const signature = JSON.stringify({
          savedAt: layout.savedAt || '',
          exportSize: layout.exportSize || null,
          items: layout.exportedItems || layout.items || []
        });
        if (!force && signature === lastLayoutSignature) return;

        lastLayoutSignature = signature;
        render(layout);
      } catch (_) {}
    }

    window.addEventListener('resize', () => loadAndRender(true));
    loadAndRender(true);
    setInterval(() => loadAndRender(false), 700);
  </script>
</body>
</html>
