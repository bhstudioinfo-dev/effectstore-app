<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">LiveFlow</title>
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#101b3b"/>
      <stop offset="1" stop-color="#03091a"/>
    </radialGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a13cff"/>
      <stop offset="1" stop-color="#6819e8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19def4"/>
      <stop offset="1" stop-color="#00c4e8"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="72" fill="url(#tile)"/>
  <rect x="96" y="150" width="320" height="154" rx="30" fill="url(#live)" filter="url(#softGlow)"/>
  <text x="256" y="258" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="106" font-weight="500" text-anchor="middle" letter-spacing="3">LIVE</text>
  <circle cx="384" cy="170" r="13" fill="#13d9ef"/>
  <path d="M164 322 C188 402 324 414 358 323" fill="none" stroke="url(#cyan)" stroke-width="28" stroke-linecap="round"/>
</svg>
