  <style id="gmd-inline-renderer">
#gift-menu-designer-view {

    min-height: 720px;
}

.gmd-toolbar {

    margin-bottom: 10px;
}
.gmd-group { display: flex; align-items: center; gap: 8px; }

.gmd-btn {

.gmd-btn.icon { min-width: 40px; padding: 8px 10px; }
.gmd-btn.primary {

}

.gmd-layout {

.gmd-panel {

.gmd-subline {

.gmd-library-controls {

.gmd-add-btn {

}

.gmd-gift-list {

.gmd-gift-name {

.gmd-my-library { padding: 14px; }
.gmd-my-library-top {

}
.gmd-my-library h4 {

}
.gmd-my-library .gmd-btn { font-size: 12px; padding: 6px 10px; border-radius: 10px; }
.gmd-my-library-list { margin-top: 10px; }
.gmd-my-library-item {

}
.gmd-my-library-item strong { font-size: 14px; }
.gmd-my-library-item span { grid-column: 1; color: #a2b6dc; font-size: 12px; }
.gmd-my-library-item i { color: #a855f7; font-size: 15px; }

.gmd-canvas-wrap {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-bottom: 10px;
}
.gmd-canvas-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas:
        "title spacer ratios"
        "tools tools tools";
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}
.gmd-canvas-header h3 {
    grid-area: title;
    margin: 0;
    color: #f8fafc;
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
    line-height: 1;
}
.gmd-canvas-tools {
    grid-area: tools;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    overflow: visible;
    padding: 2px 0 2px;
}
.gmd-tool-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(12, 22, 44, .45);
}
.gmd-canvas-tools .gmd-btn.icon {
    min-width: 34px;
    padding: 6px 8px;
}
.gmd-ratios {
    grid-area: ratios;
    margin-left: auto;
    display: flex;
    gap: 6px;
}
.gmd-ratios .gmd-btn {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 12px;
}
.gmd-ratios .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));
    border-color: rgba(192, 132, 252, 0.75);
}
.gmd-canvas-tools .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));
    border-color: rgba(192, 132, 252, 0.75);
}

.gmd-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background-color: #0b1326;
    background-image:
        linear-gradient(45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    cursor: default;
}
.gmd-canvas.is-zoomed { cursor: default; }
.gmd-canvas.is-zoomed.is-pan-mode { cursor: grab; }
.gmd-canvas.is-zoomed.is-panning { cursor: grabbing; }
.gmd-stage {
    position: absolute;
    inset: 0;
    transform-origin: center center;
}
.gmd-guide {
    position: absolute;
    display: none;
    pointer-events: none;
    z-index: 999;
    background: rgba(192, 132, 252, 0.95);
    box-shadow: 0 0 8px rgba(192, 132, 252, 0.65);
}
.gmd-guide-x {
    top: 0;
    bottom: 0;
    width: 1px;
}
.gmd-guide-y {
    left: 0;
    right: 0;
    height: 1px;
}
.gmd-safe-area {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 2px;
    background: transparent;
    box-shadow:
        0 0 0 9999px rgba(3, 9, 22, 0.34),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    pointer-events: none;
}
.gmd-zoom-pill {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    padding: 4px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(10, 20, 40, 0.92);
    color: #c9d7f7;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.gmd-zoom-btn {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(20, 34, 64, .92);
    color: #e2e8f0;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    line-height: 1;
}

.gmd-inspector-panel h3 { margin-bottom: 10px; }
.gmd-inspector-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.gmd-inspector-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(8, 16, 34, 0.8);
    margin-bottom: 10px;
    flex: 0 0 auto;
}
.gmd-inspector-tabs button {
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #a8badf;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 6px;
}
.gmd-inspector-tabs button.active { background: rgba(255, 255, 255, 0.11); color: #fff; }

.gmd-inspector-empty {
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    height: 220px;
    color: #7f93ba;
    text-align: center;
    display: grid;
    place-items: center;
    padding: 16px;
}
.gmd-inspector-empty i { font-size: 22px; opacity: .64; }
.gmd-inspector-empty p { margin: 8px 0 2px; line-height: 1.35; font-size: 14px; }
.gmd-inspector-empty small { font-size: 11px; opacity: .82; }

.gmd-field { margin-bottom: 9px; }
.gmd-field label {
    display: block;
    margin-bottom: 4px;
    color: #d6def1;
    font-size: 11px;
    font-weight: 700;
}
.gmd-select, .gmd-color {
    width: 100%;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background: rgba(5, 12, 28, 0.94);
    color: #f8fafc;
    padding: 7px 9px;
    font-size: 12px;
    box-sizing: border-box;
}
.gmd-range {
    width: 100%;
    accent-color: #a855f7;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.35);
    outline: none;
}
.gmd-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    border: 2px solid rgba(255,255,255,.8);
    box-shadow: 0 0 12px rgba(139,92,246,.45);
    cursor: pointer;
}
.gmd-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    border: 2px solid rgba(255,255,255,.8);
    box-shadow: 0 0 12px rgba(139,92,246,.45);
    cursor: pointer;
}
.gmd-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.gmd-selected-card {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    background: rgba(255,255,255,.03);
    padding: 9px 10px;
    margin-bottom: 10px;
}
.gmd-selected-card img { width: 24px; height: 24px; object-fit: contain; }
.gmd-title-input {
    width: 100%;
    border: 0;
    border-bottom: 1px dashed rgba(255,255,255,.2);
    background: transparent;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 700;
    padding: 2px 0;
}
.gmd-title-input:focus { outline: none; border-bottom-color: rgba(168,85,247,.85); }
.gmd-delete-btn {
    border: 0;
    background: transparent;
    color: #ef4444;
    font-size: 15px;
    cursor: pointer;
}

.gmd-section {
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 9px;
    background: rgba(255,255,255,.02);
    margin-bottom: 8px;
    box-sizing: border-box;
}
.gmd-section h4 {
    margin: 0 0 8px;
    color: #a855f7;
    font-size: 13px;
    font-weight: 800;
    border-bottom: 1px dashed rgba(255,255,255,.12);
    padding-bottom: 6px;
}
.gmd-section h4 i { margin-right: 6px; }

.gmd-inline-input {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    background: rgba(5,12,28,.9);
    overflow: hidden;
    box-sizing: border-box;
}
.gmd-inline-input input { border: 0; padding-left: 10px; }
.gmd-inline-input span {
    padding: 0 10px;
    color: #93a4ca;
    font-size: 12px;
    border-left: 1px solid rgba(255,255,255,.1);
}
.gmd-inline-input-single { max-width: 86px; margin-left: auto; }
.gmd-input-compact { padding: 7px 8px !important; font-size: 12px; background: transparent; }

.gmd-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.gmd-switch {
    width: 44px;
    height: 24px;
    position: relative;
    display: inline-block;
}
.gmd-switch input { display: none; }
.gmd-switch span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
    transition: .2s;
}
.gmd-switch span::after {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #fff;
    position: absolute;
    left: 3px;
    top: 3px;
    transition: .2s;
}
.gmd-switch input:checked + span { background: #7c3aed; }
.gmd-switch input:checked + span::after { transform: translateX(20px); }

.gmd-inline-color {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    gap: 6px;
    width: 100%;
    align-items: center;
}
.gmd-inline-color .gmd-color {
    padding: 0;
    height: 34px;
    border-radius: 10px;
    min-width: 0;
}

#gmd-inspector {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 3px;
}

#gmd-inspector .gmd-input,
#gmd-inspector .gmd-select,
#gmd-inspector .gmd-color,
#gmd-inspector .gmd-inline-input,
#gmd-inspector .gmd-inline-color {
    max-width: 100%;
}

#gmd-inspector::-webkit-scrollbar {
    width: 7px;
}

#gmd-inspector::-webkit-scrollbar-thumb {
    background: rgba(124, 58, 237, 0.45);
    border-radius: 8px;
}

.gmd-layer-list {
    display: grid;
    gap: 6px;
}
.gmd-layer-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    background: rgba(255,255,255,.02);
}
.gmd-layer-item.active {
    border-color: rgba(168,85,247,.7);
    box-shadow: 0 0 0 1px rgba(168,85,247,.2) inset;
}
.gmd-layer-main {
    display: grid;
    grid-template-columns: 22px 1fr;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: #e2e8f0;
    text-align: left;
    padding: 0;
    cursor: pointer;
    min-width: 0;
}
.gmd-layer-main img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}
.gmd-layer-main span {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.gmd-layer-actions {
    display: flex;
    gap: 4px;
}
.gmd-layer-btn {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(10,18,36,.9);
    color: #cbd5e1;
    font-size: 11px;
    cursor: pointer;
}
.gmd-layer-btn.off {
    color: #94a3b8;
    opacity: .7;
}

.gmd-item {
    position: absolute;
    display: block;
    align-items: center;
    user-select: none;
    transform-origin: center center;
    overflow: visible;
}
.gmd-visual {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}
.gmd-aura {
    position: absolute;
    inset: -9%;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
    z-index: 1;
    transform-style: preserve-3d;
    perspective: 600px;
    transform: scale(var(--aura-scale, 1));
    transform-origin: center center;
}
.gmd-aura-back { z-index: 1; }
.gmd-aura-front { z-index: 3; }
.gmd-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
}
.gmd-icon-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
}
.gmd-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
}
.gmd-aura::before,
.gmd-aura::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
}
/* Front glass disabled by default; enable selectively per aura type */
.gmd-aura-front { display: none; }
.gmd-aura-front::before,
.gmd-aura-front::after {
    inset: 0;
    background: transparent;
    border: 0;
    opacity: 0;
}
.aura-glow::before {
    inset: -7%;
    background: radial-gradient(circle at 50% 52%,
        color-mix(in srgb, var(--aura-color, #c084fc) 52%, transparent) 0%,
        color-mix(in srgb, var(--aura-color, #c084fc) 26%, transparent) 44%,
        transparent 80%);

                          ${item.showAvatar !== false ? `<div class="gmd-contrib-avatar" style="width: ${Math.round(48 * s)}px; height: ${Math.round(48 * s)}px; border-radius: 50%; background: #2e3b5e; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; background-image: url('${c.avatar || ''}'); background-size: cover;"></div>` : ''}
                          <span class="gmd-contrib-name" style="color: ${item.useCustomTextColor ? (item.textColor || '#cbd5e1') : ''};">${safeText(c.nickname || 'BH Studio')}</span>
                          ${item.showValue !== false ? `<span class="gmd-contrib-val">${c.value}💎</span>` : ''}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              `;
            } else if (item.type === 'podium-contributors') {
              const contributors = Array.isArray(item.contributors) ? item.contributors : [];
              const headerSize = Math.round((item.fontSize || 34) * s);
              const nameSize = Math.round((item.rowFontSize || 22) * s);
              const valSize = Math.round((item.valueFontSize || 22) * s);
              widgetHTML = `
                <div class="gmd-podium-widget" style="background: ${item.hideBg ? 'transparent' : (item.useCustomBg ? getTranslucentBg(item.bgColor) : `radial-gradient(circle at center, rgba(234, 179, 8, 0.1) 0%, #0a0a14 100%)`)}; border: ${item.hideBg ? '1px solid transparent' : `1px solid ${item.useCustomBg ? getTranslucentBg(item.bgColor) : '#eab308'}`}; border-radius: ${Math.round(24 * s)}px; padding: ${Math.round(18 * s)}px; display: flex; flex-direction: column; justify-content: center; height: 100%; box-sizing: border-box; width: 100%;">
                  <div style="transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px); display: flex; flex-direction: column; width: 100%;">
                    <div class="gmd-podium-header" style="font-size: ${headerSize}px; padding-bottom: ${Math.round(8 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#eab308') : ''};">👑 VƯƠNG MIỆN HOÀNG GIA</div>
                    <div class="gmd-podium-podium" style="gap: ${Math.round(14 * s)}px;">
                      <div class="gmd-podium-spot rank-2">
                        <div class="gmd-podium-avatar-wrap">
                          <div class="gmd-podium-crown" style="font-size: ${Math.round(32 * s)}px; top: -${Math.round(20 * s)}px;">🥈</div>
                          <div class="gmd-podium-avatar" style="width: ${Math.round(64 * s)}px; height: ${Math.round(64 * s)}px; display:flex; align-items:center; justify-content:center; font-size:${Math.round(28 * s)}px; background-image: url('${contributors[1]?.avatar || ''}'); background-size: cover;">${contributors[1]?.avatar ? '' : '👤'}</div>
                        </div>
                        <div class="gmd-podium-name" style="font-size: ${nameSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">${safeText(contributors[1]?.nickname || 'Trống')}</div>
                        ${item.showValue !== false ? `<div class="gmd-podium-value" style="font-size: ${valSize}px;">${contributors[1]?.value || 0}💎</div>` : ''}
                      </div>
                      <div class="gmd-podium-spot rank-1">
                        <div class="gmd-podium-avatar-wrap">
                          <div class="gmd-podium-crown" style="font-size: ${Math.round(44 * s)}px; top: -${Math.round(28 * s)}px;">👑</div>
                          <div class="gmd-podium-glow-ring" style="inset: -${Math.round(6 * s)}px; border-width: ${Math.round(3 * s)}px;"></div>
                          <div class="gmd-podium-avatar" style="width: ${Math.round(88 * s)}px; height: ${Math.round(88 * s)}px; display:flex; align-items:center; justify-content:center; font-size:${Math.round(38 * s)}px; background-image: url('${contributors[0]?.avatar || ''}'); background-size: cover;">${contributors[0]?.avatar ? '' : '👤'}</div>
                        </div>
                        <div class="gmd-podium-name" style="font-size: ${nameSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">${safeText(contributors[0]?.nickname || 'Vua Donate')}</div>
                        ${item.showValue !== false ? `<div class="gmd-podium-value" style="font-size: ${valSize}px;">${contributors[0]?.value || 0}💎</div>` : ''}
                      </div>
                      <div class="gmd-podium-spot rank-3">
                        <div class="gmd-podium-avatar-wrap">
                          <div class="gmd-podium-crown" style="font-size: ${Math.round(32 * s)}px; top: -${Math.round(20 * s)}px;">🥉</div>
                          <div class="gmd-podium-avatar" style="width: ${Math.round(64 * s)}px; height: ${Math.round(64 * s)}px; display:flex; align-items:center; justify-content:center; font-size:${Math.round(28 * s)}px; background-image: url('${contributors[2]?.avatar || ''}'); background-size: cover;">${contributors[2]?.avatar ? '' : '👤'}</div>
                        </div>
                        <div class="gmd-podium-name" style="font-size: ${nameSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">${safeText(contributors[2]?.nickname || 'Trống')}</div>
                        ${item.showValue !== false ? `<div class="gmd-podium-value" style="font-size: ${valSize}px;">${contributors[2]?.value || 0}💎</div>` : ''}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            } else if (item.type === 'mystery-chests') {
              const current = Number(item.currentCount || 0);
              const target = Number(item.targetCount || 100);
              const pct = Math.min(100, Math.round((current / (target || 1)) * 100));
              const titleText = item.name || '🎁 MỞ KHÓA HỘP QUÀ KỲ BÍ';
              const titleSize = Math.round((item.fontSize || 32) * s);
              const subSize = Math.round((item.subtitleFontSize || 20) * s);
              
              widgetHTML = `
                <div class="gmd-mystery-widget" style="background: ${item.hideBg ? 'transparent' : (item.useCustomBg ? getTranslucentBg(item.bgColor) : `radial-gradient(circle at center, rgba(168, 85, 247, 0.1) 0%, #0a0a14 100%)`)}; border: ${item.hideBg ? '1px solid transparent' : `1px solid ${item.useCustomBg ? getTranslucentBg(item.bgColor) : (item.barColor || '#a855f7')}`}; border-radius: ${Math.round(24 * s)}px; padding: ${Math.round(18 * s)}px; display: flex; flex-direction: column; justify-content: center; height: 100%; box-sizing: border-box; width: 100%;">
                  <div style="transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px); display: flex; flex-direction: column; width: 100%;">
                    <div class="gmd-mystery-header" style="font-size: ${titleSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : (item.titleColor || '#ffffff')};">${safeText(titleText)}</div>
                    <div class="gmd-mystery-title-row" style="font-size: ${Math.round(26 * s)}px; margin-top: ${Math.round(6 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">
                      <span>${safeText(item.giftName || 'Hộp Quà')} Goal</span>
                      <span>${current}/${target}</span>
                    </div>
                    <div class="gmd-mystery-track-wrap" style="margin-top: ${Math.round(16 * s)}px;">
                      <div class="gmd-mystery-bar-outer" style="height: ${Math.round((item.barHeight !== undefined ? item.barHeight : 24) * s)}px; border-radius: ${Math.round(24 * s)}px;">
                        <div class="gmd-mystery-bar-inner gmd-bar-style-${item.barStyle || 'solid'}" style="width: ${pct}%; border-radius: ${Math.round(24 * s)}px; --bar-color: ${item.barColor || '#a855f7'}; --bar-glow: ${item.glowColor || '#fb7185'};"></div>
                      </div>
                      <div class="gmd-mystery-milestones">
                        <div class="gmd-mystery-node ${pct >= 25 ? 'unlocked' : ''}" style="left: 25%;">
                          <span class="gmd-mystery-chest" style="font-size: ${Math.round((pct >= 25 ? 44 : 32) * s)}px; top: -${Math.round(8 * s)}px;">📦</span>
                          <span class="gmd-mystery-pct" style="font-size: ${Math.round(20 * s)}px; margin-top: ${Math.round(8 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">25%</span>
                        </div>
                        <div class="gmd-mystery-node ${pct >= 50 ? 'unlocked' : ''}" style="left: 50%;">
                          <span class="gmd-mystery-chest" style="font-size: ${Math.round((pct >= 50 ? 44 : 32) * s)}px; top: -${Math.round(8 * s)}px;">🧰</span>
                          <span class="gmd-mystery-pct" style="font-size: ${Math.round(20 * s)}px; margin-top: ${Math.round(8 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">50%</span>
                        </div>
                        <div class="gmd-mystery-node ${pct >= 75 ? 'unlocked' : ''}" style="left: 75%;">
                          <span class="gmd-mystery-chest" style="font-size: ${Math.round((pct >= 75 ? 44 : 32) * s)}px; top: -${Math.round(8 * s)}px;">🪙</span>
                          <span class="gmd-mystery-pct" style="font-size: ${Math.round(20 * s)}px; margin-top: ${Math.round(8 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">75%</span>
                        </div>
                        <div class="gmd-mystery-node ${pct >= 100 ? 'unlocked' : ''}" style="left: 100%;">
                          <span class="gmd-mystery-chest" style="font-size: ${Math.round((pct >= 100 ? 44 : 32) * s)}px; top: -${Math.round(8 * s)}px;">💎</span>
                          <span class="gmd-mystery-pct" style="font-size: ${Math.round(20 * s)}px; margin-top: ${Math.round(8 * s)}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">100%</span>
                        </div>
                      </div>
                    </div>
                    ${item.subtitleText ? `<div style="font-size: ${subSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#fda4af') : (item.subtitleColor || '#fda4af')}; text-align: center; margin-top: ${Math.round(6 * s)}px; font-weight: bold; line-height: 1.2;">${safeText(item.subtitleText)}</div>` : ''}
                  </div>
                </div>
              `;
            } else if (item.type === 'combo') {
              const count = item.comboCount || 88;
              const titleSize = Math.round((item.fontSize || 40) * s);
              const numSize = Math.round((item.numberFontSize || 64) * s);
              const subSize = Math.round((item.subtitleFontSize || 20) * s);
              const subtitle = item.subtitleText ? `<div style="font-size: ${subSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#fca5a5') : (item.subtitleColor || '#fca5a5')}; font-weight: bold; margin-top: ${Math.round(4 * s)}px; line-height: 1.2;">${safeText(item.subtitleText)}</div>` : '';
              
              widgetHTML = `
                <div class="gmd-combo-widget" style="background: ${item.hideBg ? 'transparent' : (item.useCustomBg ? getTranslucentBg(item.bgColor) : `radial-gradient(circle at center, rgba(239, 68, 68, 0.15) 0%, #0a0a14 100%)`)}; border: ${item.hideBg ? 'none' : `1.5px solid ${item.useCustomBg ? getTranslucentBg(item.bgColor) : (item.barColor || '#ef4444')}`}; font-size: ${titleSize}px; border-radius: ${Math.round(24 * s)}px; flex-direction: column; justify-content: center; height: 100%; box-sizing: border-box; width: 100%; padding: ${Math.round(12 * s)}px; gap: ${Math.round(8 * s)}px; display: flex; align-items: center; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : '#ffffff'}; box-shadow: ${item.hideBg ? 'none' : `0 0 ${Math.round(12 * s)}px rgba(239, 68, 68, 0.2)`};">
                  <div style="transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px); display: flex; flex-direction: column; align-items: center; gap: ${Math.round(8 * s)}px; width: 100%;">
                    <div class="gmd-combo-num" style="font-size: ${numSize}px; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">x${count}</div>
                    <div style="color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : ''};">${item.name || 'COMBO ĐANG CHẠY!'}</div>
                    ${subtitle}
                  </div>
                </div>
              `;
            } else if (item.type === 'goal-list') {
              const title = item.name || 'MỤC TIÊU HÔM NAY 🎯';
              const goals = Array.isArray(item.goals) ? item.goals : [];
              const footerText = item.footerText || '';
              const color = item.barColor || '#ff007f';
              const headerSize = Math.round((item.fontSize || 32) * s);
              const rowSize = Math.round((item.rowFontSize || 22) * s);
              const footerSize = Math.round((item.footerFontSize || 20) * s);

              const isAutoScroll = item.autoScroll === true;
              const scrollDuration = item.autoScrollSpeed !== undefined ? item.autoScrollSpeed : 15;
              const enableShimmer = item.shimmerEffect !== false;

              // Duplicate the list when auto scroll is active to support seamless vertical looping
              const goalsListToRender = isAutoScroll && goals.length > 0 ? [...goals, ...goals] : goals;
              
              widgetHTML = `
                <div class="gmd-goal-list-widget" style="width:100%; height:100%; padding: ${Math.round(24 * s)}px; box-sizing: border-box; background: ${item.hideBg ? 'transparent' : (item.useCustomBg ? getTranslucentBg(item.bgColor) : `radial-gradient(circle at center, ${color}1a, #0a0a14)`)}; border: ${item.hideBg ? '1px solid transparent' : `1px solid ${item.useCustomBg ? getTranslucentBg(item.bgColor) : color}`}; border-radius: ${Math.round(24 * s)}px; display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden; box-shadow: ${item.hideBg ? 'none' : `0 0 ${Math.round(30 * s)}px ${color}26, 0 ${Math.round(8 * s)}px ${Math.round(32 * s)}px rgba(0,0,0,0.6)`};">
                  <div class="gmd-goal-list-header" style="font-weight:900; color: ${item.useCustomTextColor ? (item.textColor || '#ffffff') : color}; text-shadow: 0 0 ${Math.round(10 * s)}px ${color}80; text-align:center; font-size: ${headerSize}px; margin-bottom: ${Math.round(12 * s)}px; flex-shrink: 0; transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px);">${safeText(title)}</div>
                  
                  <div class="gmd-goal-list-scroll-container" style="flex: 1; overflow: hidden; position: relative; width: 100%; transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px);">
                    <div class="${isAutoScroll ? 'gmd-goal-list-marquee-track' : 'gmd-goal-list-static-track'}" style="${isAutoScroll ? `animation: gmdMarqueeVertical ${scrollDuration}s linear infinite;` : `display:flex; flex-direction:column; gap: ${Math.round(12 * s)}px;`}">
                      ${goalsListToRender.map(g => {
                        const pct = Math.min(100, Math.round((g.current || 0) / (g.target || 1) * 100));
                        const iconUrl = g.icon ? (g.icon.startsWith('http') ? g.icon : `${g.icon.startsWith('/') ? '' : '/'}${g.icon}`) : '';
                        return `
                          <div class="gmd-goal-list-row ${enableShimmer ? 'gmd-shimmer-row' : ''}" style="display:flex; flex-direction:column; gap: ${Math.round(8 * s)}px; background:rgba(255,255,255,0.02); padding: ${Math.round(12 * s)}px ${Math.round(16 * s)}px; border-radius: ${Math.round(12 * s)}px; margin-bottom: ${isAutoScroll ? `${Math.round(12 * s)}px` : '0'}; position: relative; overflow: hidden;">
                            <div class="gmd-goal-list-text-row" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                              <div style="display:flex; align-items:center; gap:${Math.round(8 * s)}px;">
                                ${iconUrl ? `<img class="gmd-goal-list-icon" src="${iconUrl}" style="width: ${Math.round((item.iconSize !== undefined ? item.iconSize : 28) * s)}px; height: ${Math.round((item.iconSize !== undefined ? item.iconSize : 28) * s)}px; border-radius:50%;" alt="">` : `<div style="font-size:${Math.round((item.iconSize !== undefined ? Math.round(item.iconSize * 0.7) : 20) * s)}px;">🎁</div>`}
                                ${item.showGiftName !== false ? `<span class="gmd-goal-list-label" style="font-size: ${rowSize}px; font-weight:800; color:${item.useCustomTextColor ? (item.textColor || '#cbd5e1') : '#e2e8f0'};">${safeText(g.giftName || 'Gift')}</span>` : ''}
                              </div>
                              <span class="gmd-goal-list-counts" style="font-size: ${rowSize}px; font-weight:800; color: ${item.barColor || '#38bdf8'}; text-shadow: 0 0 ${Math.round(10 * s)}px ${item.barColor || '#38bdf8'}80;">${g.current}/${g.target} (${pct}%)</span>
                            </div>
                            <div class="gmd-goal-list-bar-outer" style="width:100%; height: ${Math.round((item.barHeight !== undefined ? item.barHeight : 12) * s)}px; background:rgba(0,0,0,0.35); border-radius:99px; overflow:hidden; border: none; position:relative;">
                              <div class="gmd-goal-list-bar-inner gmd-bar-style-${item.barStyle || 'solid'}" style="width:${pct}%; height:100%; --bar-color: ${item.barColor || '#38bdf8'}; --bar-glow: ${item.barColor || '#38bdf8'}; background:${item.barColor || '#38bdf8'}; border-radius:99px; box-shadow: 0 0 ${Math.round(12 * s)}px ${item.barColor || '#38bdf8'};"></div>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                  
                  ${footerText ? `<div class="gmd-goal-list-footer" style="text-align:center; font-size: ${footerSize}px; color:#cbd5e1; font-weight:bold; margin-top: ${Math.round(12 * s)}px; flex-shrink: 0; transform: translateY(${Math.round((item.contentOffsetY || 0) * s)}px);">${safeText(footerText)}</div>` : ''}
                </div>
              `;
            } else if (item.type === 'text') {
              widgetHTML = `
                <div class="gmd-text-widget" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:${item.color || '#ffffff'}; font-size:${Math.round((item.fontSize || 36) * s)}px; font-weight:${item.fontWeight || 'bold'}; text-shadow:${item.textShadow || 'none'}; text-align:${item.textAlign || 'center'}; font-family:inherit; line-height:1.2; word-break:break-word; pointer-events:none;">
                  ${safeText(item.text || 'Nhập văn bản')}
                </div>
              `;
            }

            // Outer wrapper scale transformation
            const scaleX = (item.width || refW / 3) / refW;
            const scaleY = (item.height || refH / 3) / refH;
            const wrapperScaleX = scaleX * s;
            const wrapperScaleY = scaleY * s;

            el.innerHTML = `
              <div class="gmd-visual-scaled-wrapper" style="width: ${refW}px; height: ${refH}px; transform: scale(${wrapperScaleX}, ${wrapperScaleY}); transform-origin: top left; position: absolute; top: 0; left: 0; pointer-events: none;">
                ${widgetHTML}
              </div>
            `;
          } else {
            // STANDARD GIFT RENDERING
            const auraClass = auraMap[item.auraType] || '';
            const motionClass = motionMap[item.animationType] || '';
            const shape = auraShapeVars(item.auraShape);
            const left = offsetX + (Number(item.x) || 0) * s;
            const top = offsetY + (Number(item.y) || 0) * s;
            const width = (Number(item.width) || 84) * s;
            const height = (Number(item.height) || 84) * s;
            const scale = s;
            const textSize = (Number(item.textSize) || 13) * scale;
            const textGap = (Number(item.textGap) || 4) * scale;
            const auraSpeed = Math.max(0.2, Number(item.auraSpeed) || 1);
            const animSpeed = Math.max(0.2, Number(item.animationSpeed) || 1);
            const auraScale = Number(item.auraScale || 1);
            const iconUrl = item.iconUrl || '';
            const name = safeText(item.name || '');

            el.style.left = `${left}px`;
            el.style.top = `${top}px`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;
            el.style.transform = `rotate(${Number(item.rotation) || 0}deg)`;
            el.style.zIndex = String(Number(item.zIndex) || 1);

            el.innerHTML = `
              <div class="gmd-visual ${motionClass} ${auraClass}"
                style="--aura-color:${item.auraColor || '#d7b2ff'};--aura-radius:${shape.radius};--aura-clip:${shape.clip};--anim-speed:${animSpeed}s;--aura-speed:${auraSpeed}s;--aura-scale:${auraScale};--icon-url:url('${iconUrl}');">
                <span class="gmd-aura gmd-aura-back ${auraClass}"></span>
                <span class="gmd-icon-wrap" style="--icon-url:url('${iconUrl}')">
                  <img src="${iconUrl}" alt="${name}">
                </span>
                <span class="gmd-aura gmd-aura-front ${auraClass}"></span>
              </div>
              ${item.showName ? `<div class="gmd-item-label pos-${item.textPosition || 'bottom'}" style="font-size:${textSize}px;color:${item.textColor || '#f7cb64'};--label-gap:${textGap}px;">${name}</div>` : ''}
            `;
          }
          root.appendChild(el);
        });
    }

    async function loadAndRender(force = false) {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('preview') === 'true') {
          if (document.body) {
            document.body.style.background = '#060d1f';
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              document.body.style.background = '#060d1f';
            });
          }
        }
        const layoutId = params.get('layoutId') || '';
        const userId = params.get('userId') || '';
        let url = `/api/tiktok/gift-menu-overlay-layout?t=${Date.now()}`;
        if (layoutId) url += `&layoutId=${layoutId}`;
        if (userId) url += `&userId=${userId}`;
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();
        if (!(data && data.success && data.layout)) return;

        const layout = data.layout;
        const signature = JSON.stringify({
          savedAt: layout.savedAt || '',
          exportSize: layout.exportSize || null,
          items: layout.exportedItems || layout.items || []
        });
        if (!force && signature === lastLayoutSignature) return;

        lastLayoutSignature = signature;
        render(layout);
      } catch (err) {
        console.error('Error loading or rendering layout:', err);
      }
    }

    window.addEventListener('resize', () => loadAndRender(true));
    loadAndRender(true);
    setInterval(() => loadAndRender(false), 700);
  </script>
</body>
</html>
