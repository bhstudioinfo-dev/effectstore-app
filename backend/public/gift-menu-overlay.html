  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;

      background: #060d1f !important;

    #overlay-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #overlay-root.gmd-effect-playback-hidden {
      opacity: 0;
    }

  <style id="gmd-inline-renderer">
#gift-menu-designer-view {
    height: calc(100vh - 150px);
    min-height: 720px;
}

.gift-menu-designer {
    height: 100%;
    padding: 12px;

        radial-gradient(1100px 600px at 30% -20%, rgba(124, 58, 237, 0.22), transparent 55%),

}

.gmd-headline { margin-bottom: 8px; }
.gmd-brand {
    color: #f8fafc;
    font-size: 19px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0;
}
.gmd-brand span { color: rgba(148, 163, 184, 0.55); font-weight: 600; }
.gmd-brand em {

    font-size: 10px;

}

.gmd-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}
.gmd-group { display: flex; align-items: center; gap: 8px; }

.gmd-btn {
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: linear-gradient(180deg, rgba(20, 33, 64, 0.9), rgba(14, 24, 48, 0.9));

}
.gmd-btn:hover { border-color: rgba(192, 132, 252, 0.68); box-shadow: 0 0 0 1px rgba(192, 132, 252, 0.35), 0 8px 20px rgba(124, 58, 237, 0.18); }
.gmd-btn.icon { min-width: 40px; padding: 8px 10px; }
.gmd-btn.primary {
    border: none;
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    box-shadow: 0 10px 24px rgba(139, 92, 246, 0.28);
}

.gmd-layout {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 10px;
    height: calc(100% - 88px);
}

.gmd-left-col {
    display: grid;
    grid-template-rows: 1fr auto;

}

.gmd-panel {
    min-height: 0;

    border: 1px solid rgba(255, 255, 255, 0.08);
    background: linear-gradient(180deg, rgba(11, 24, 52, 0.84), rgba(8, 16, 35, 0.84));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);

}

.gmd-panel h3 {
    margin: 0 0 6px;
    color: #f8fafc;
    font-size: 18px;
    line-height: 1.08;
    font-weight: 800;
}

.gmd-subline {

    color: #8ea1c8;
    font-size: 12px;
    line-height: 1.3;
}

.gmd-library-controls {
    display: grid;
    grid-template-columns: 1fr 44px;
    gap: 8px;
    margin-bottom: 10px;
}
.gmd-search-wrap { position: relative; }

}
.gmd-input {
    width: 100%;

    border: 1px solid rgba(255, 255, 255, 0.11);

    border-radius: 10px;
    padding: 9px 11px 9px 30px;
    font-size: 12px;
}
.gmd-input:focus, .gmd-select:focus, .gmd-color:focus { outline: none; border-color: rgba(192, 132, 252, 0.7); }

.gmd-add-btn {
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
}

.gmd-gift-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-height: calc(100% - 106px);
    overflow: auto;
    padding-right: 4px;
}
.gmd-gift-card {
    border: 1px solid rgba(255, 255, 255, 0.08);

.gmd-gift-card:hover {

}
.gmd-gift-card img {
    width: 40px;
    height: 40px;
    object-fit: contain;

}
.gmd-gift-name {
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
}

.gmd-my-library { padding: 14px; }
.gmd-my-library-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
}
.gmd-my-library h4 {
    margin: 0;
    color: #f8fafc;
    font-size: 16px;
    line-height: 1.12;
    font-weight: 800;
}
.gmd-my-library .gmd-btn { font-size: 12px; padding: 6px 10px; border-radius: 10px; }
.gmd-my-library-list { margin-top: 10px; }
.gmd-my-library-item {
    border: 1px solid rgba(168, 85, 247, 0.46);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(88, 28, 135, 0.24), rgba(67, 20, 112, 0.2));
    padding: 10px 12px;
    color: #dbeafe;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 8px;
    align-items: center;
}
.gmd-my-library-item strong { font-size: 14px; }
.gmd-my-library-item span { grid-column: 1; color: #a2b6dc; font-size: 12px; }
.gmd-my-library-item i { color: #a855f7; font-size: 15px; }

.gmd-canvas-wrap {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-bottom: 10px;
}
.gmd-canvas-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas:
        "title spacer ratios"
        "tools tools tools";
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}
.gmd-canvas-header h3 {
    grid-area: title;
    margin: 0;
    color: #f8fafc;
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
    line-height: 1;
}
.gmd-canvas-tools {
    grid-area: tools;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    overflow: visible;
    padding: 2px 0 2px;
}
.gmd-tool-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(12, 22, 44, .45);
}
.gmd-canvas-tools .gmd-btn.icon {
    min-width: 34px;
    padding: 6px 8px;
}
.gmd-ratios {
    grid-area: ratios;
    margin-left: auto;
    display: flex;
    gap: 6px;
}
.gmd-ratios .gmd-btn {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 12px;
}
.gmd-ratios .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));
    border-color: rgba(192, 132, 252, 0.75);
}
.gmd-canvas-tools .gmd-btn.active {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(147, 51, 234, 0.55));
    border-color: rgba(192, 132, 252, 0.75);
}

.gmd-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background-color: #0b1326;
    background-image:
        linear-gradient(45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.085) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.085) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    cursor: default;
}
.gmd-canvas.is-zoomed { cursor: default; }
.gmd-canvas.is-zoomed.is-pan-mode { cursor: grab; }
.gmd-canvas.is-zoomed.is-panning { cursor: grabbing; }
.gmd-stage {
    position: absolute;
    inset: 0;
    transform-origin: center center;
}
.gmd-guide {
    position: absolute;
    display: none;
    pointer-events: none;
    z-index: 999;
    background: rgba(192, 132, 252, 0.95);
    box-shadow: 0 0 8px rgba(192, 132, 252, 0.65);
}
.gmd-guide-x {
    top: 0;
    bottom: 0;
    width: 1px;
}
.gmd-guide-y {
    left: 0;
    right: 0;
    height: 1px;
}
.gmd-safe-area {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 2px;
    background: transparent;
    box-shadow:
        0 0 0 9999px rgba(3, 9, 22, 0.34),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    pointer-events: none;
}
.gmd-zoom-pill {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    padding: 4px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(10, 20, 40, 0.92);
    color: #c9d7f7;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.gmd-zoom-btn {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(20, 34, 64, .92);
    color: #e2e8f0;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    line-height: 1;
}

.gmd-inspector-panel h3 { margin-bottom: 10px; }
.gmd-inspector-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.gmd-inspector-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(8, 16, 34, 0.8);
    margin-bottom: 10px;
    flex: 0 0 auto;
}
.gmd-inspector-tabs button {
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #a8badf;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 6px;
}
.gmd-inspector-tabs button.active { background: rgba(255, 255, 255, 0.11); color: #fff; }

.gmd-inspector-empty {
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    height: 220px;
    color: #7f93ba;
    text-align: center;
    display: grid;
    place-items: center;
    padding: 16px;
}
.gmd-inspector-empty i { font-size: 22px; opacity: .64; }
.gmd-inspector-empty p { margin: 8px 0 2px; line-height: 1.35; font-size: 14px; }
.gmd-inspector-empty small { font-size: 11px; opacity: .82; }

.gmd-field { margin-bottom: 9px; }
.gmd-field label {
    display: block;
    margin-bottom: 4px;
    color: #d6def1;
    font-size: 11px;
    font-weight: 700;
}
.gmd-select, .gmd-color {
    width: 100%;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background: rgba(5, 12, 28, 0.94);
    color: #f8fafc;
    padding: 7px 9px;
    font-size: 12px;
    box-sizing: border-box;
}
.gmd-range {
    width: 100%;
    accent-color: #a855f7;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.35);
    outline: none;
}
.gmd-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    border: 2px solid rgba(255,255,255,.8);
    box-shadow: 0 0 12px rgba(139,92,246,.45);
    cursor: pointer;
}
.gmd-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    border: 2px solid rgba(255,255,255,.8);
    box-shadow: 0 0 12px rgba(139,92,246,.45);
    cursor: pointer;
}
.gmd-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.gmd-selected-card {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    background: rgba(255,255,255,.03);
    padding: 9px 10px;
    margin-bottom: 10px;
}
.gmd-selected-card img { width: 24px; height: 24px; object-fit: contain; }
.gmd-title-input {
    width: 100%;
    border: 0;
    border-bottom: 1px dashed rgba(255,255,255,.2);
    background: transparent;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 700;
    padding: 2px 0;
}
.gmd-title-input:focus { outline: none; border-bottom-color: rgba(168,85,247,.85); }
.gmd-delete-btn {
    border: 0;
    background: transparent;
    color: #ef4444;
    font-size: 15px;
    cursor: pointer;
}

.gmd-section {
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 9px;
    background: rgba(255,255,255,.02);
    margin-bottom: 8px;
    box-sizing: border-box;
}
.gmd-section h4 {
    margin: 0 0 8px;
    color: #a855f7;
    font-size: 13px;
    font-weight: 800;
    border-bottom: 1px dashed rgba(255,255,255,.12);
    padding-bottom: 6px;
}
.gmd-section h4 i { margin-right: 6px; }

.gmd-inline-input {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    background: rgba(5,12,28,.9);
    overflow: hidden;
    box-sizing: border-box;
}
.gmd-inline-input input { border: 0; padding-left: 10px; }
.gmd-inline-input span {
    padding: 0 10px;
    color: #93a4ca;
    font-size: 12px;
    border-left: 1px solid rgba(255,255,255,.1);
}
.gmd-inline-input-single { max-width: 86px; margin-left: auto; }
.gmd-input-compact { padding: 7px 8px !important; font-size: 12px; background: transparent; }

.gmd-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.gmd-switch {
    width: 44px;
    height: 24px;
    position: relative;
    display: inline-block;
}
.gmd-switch input { display: none; }
.gmd-switch span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
    transition: .2s;
}
.gmd-switch span::after {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #fff;
    position: absolute;
    left: 3px;
    top: 3px;
    transition: .2s;
}
.gmd-switch input:checked + span { background: #7c3aed; }
.gmd-switch input:checked + span::after { transform: translateX(20px); }

.gmd-inline-color {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    gap: 6px;
    width: 100%;
    align-items: center;
}
.gmd-inline-color .gmd-color {
    padding: 0;
    height: 34px;
    border-radius: 10px;
    min-width: 0;
}

#gmd-inspector {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 3px;
}

#gmd-inspector .gmd-input,
#gmd-inspector .gmd-select,
#gmd-inspector .gmd-color,
#gmd-inspector .gmd-inline-input,
#gmd-inspector .gmd-inline-color {
    max-width: 100%;
}

#gmd-inspector::-webkit-scrollbar {
    width: 7px;
}

#gmd-inspector::-webkit-scrollbar-thumb {
    background: rgba(124, 58, 237, 0.45);
    border-radius: 8px;
}

.gmd-layer-list {
    display: grid;
    gap: 6px;
}
.gmd-layer-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    background: rgba(255,255,255,.02);
}
.gmd-layer-item.active {
    border-color: rgba(168,85,247,.7);
    box-shadow: 0 0 0 1px rgba(168,85,247,.2) inset;
}
.gmd-layer-main {
    display: grid;
    grid-template-columns: 22px 1fr;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: #e2e8f0;
    text-align: left;
    padding: 0;
    cursor: pointer;
    min-width: 0;
}
.gmd-layer-main img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}
.gmd-layer-main span {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.gmd-layer-actions {
    display: flex;
    gap: 4px;
}
.gmd-layer-btn {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(10,18,36,.9);
    color: #cbd5e1;
    font-size: 11px;
    cursor: pointer;
}
.gmd-layer-btn.off {
    color: #94a3b8;
    opacity: .7;
}

.gmd-item {
    position: absolute;
    display: block;
    align-items: center;
    user-select: none;
    transform-origin: center center;
    overflow: visible;
}
.gmd-visual {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}
.gmd-aura {
    position: absolute;
    inset: -9%;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
    z-index: 1;
    transform-style: preserve-3d;
    perspective: 600px;
    transform: scale(var(--aura-scale, 1));
    transform-origin: center center;
}
.gmd-aura-back { z-index: 1; }
.gmd-aura-front { z-index: 3; }
.gmd-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
}
.gmd-icon-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
}
.gmd-icon-wrap :is(img, video) {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
}
.gmd-aura::before,
.gmd-aura::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--aura-radius, 50%);
    clip-path: var(--aura-clip, none);
    pointer-events: none;
}
/* Front glass disabled by default; enable selectively per aura type */
.gmd-aura-front { display: none; }
.gmd-aura-front::before,

                if (!document.getElementById('gmd-talent-title-effects')) { const style = document.createElement('style'); style.id = 'gmd-talent-title-effects'; style.textContent = '@keyframes gmdTalentTitlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes gmdTalentTitleRainbow{0%{color:#f472b6}50%{color:#fbbf24}100%{color:#22d3ee}}'; document.head.appendChild(style); }
                title.style.textShadow = effect === 'none' ? 'none' : effect === 'neon' ? '0 0 8px #22d3ee,0 0 22px #a855f7' : effect === 'fire' ? '0 0 10px #ef4444,0 0 24px #f59e0b' : '0 0 14px #fbbf24';
                title.style.color = effect === 'fire' ? '#fbbf24' : effect === 'neon' ? '#67e8f9' : '';
                title.style.animation = effect === 'pulse' ? 'gmdTalentTitlePulse 1.4s ease-in-out infinite' : effect === 'rainbow' ? 'gmdTalentTitleRainbow 2.4s linear infinite' : '';
              }
            }
          } else {
            // STANDARD GIFT RENDERING
            const left = offsetX + (Number(item.x) || 0) * s;
            const top = offsetY + (Number(item.y) || 0) * s;
            const width = (Number(item.width) || 84) * s;
            const height = (Number(item.height) || 84) * s;
            
            el.style.left = `${left}px`;
            el.style.top = `${top}px`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;
            el.style.transform = `rotate(${Number(item.rotation) || 0}deg)`;
            el.style.zIndex = String(Number(item.zIndex) || 1);

            el.innerHTML = window.MenuDesignerSharedRenderEngine && typeof window.MenuDesignerSharedRenderEngine.renderByType === 'function'
              ? window.MenuDesignerSharedRenderEngine.renderByType(item, { mode: 'overlay', scale: s, apiBase: '', escapeText: true, gifts: giftsLibrary })
              : '';
      }
      return el;
    }

    function render(layout) {
      const root = document.getElementById('overlay-root') || document.body;
      if (!root) {
        window.addEventListener('DOMContentLoaded', () => render(layout));
        return;
      }
      const items = Array.isArray(layout.exportedItems)
        ? layout.exportedItems
        : (Array.isArray(layout.items) ? layout.items : []);

      if (items.length === 0) {
        if (new URLSearchParams(window.location.search).get('preview') === 'true') {
          itemElementCache.forEach((entry) => entry.el.remove());
          itemElementCache.clear();
          root.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #94a3b8; font-family: Inter, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
              <div style="font-size: 54px; margin-bottom: 16px; animation: gmdFloat 3s ease-in-out infinite;">🎨</div>
              <h2 style="color: #fff; margin: 0 0 12px 0; font-size: 24px; font-weight: 800;">Xem trước bảng quà</h2>
              <p style="margin: 4px 0; font-size: 15px; line-height: 1.5;">Thiết kế của bạn hiện đang trống hoặc chưa được lưu.</p>
              <p style="font-size: 13px; color: #64748b; margin-top: 8px;">Hãy thêm các phần quà/bảng mục tiêu trên Canvas của designer và bấm <strong>Lưu</strong>.</p>
            </div>
          `;
          return;
        }
      }

      const exportW = Number(layout.exportSize && layout.exportSize.width) || 1080;
      const exportH = Number(layout.exportSize && layout.exportSize.height) || 1920;
      const sx = window.innerWidth / exportW;
      const sy = window.innerHeight / exportH;
      const s = Math.min(sx, sy) || 1;

      const offsetX = Math.round((window.innerWidth - (exportW * s)) / 2);
      const offsetY = Math.round((window.innerHeight - (exportH * s)) / 2);

      // Only rebuild the DOM node for an item whose data actually changed
      // since the last render. Untouched items keep their existing element
      // (moved into place via appendChild, which does not restart already-
      // running CSS animations), so a single gift/counter update no longer
      // restarts marquee/spin/sweep loops on every other widget on screen.
      const positionKey = `${s.toFixed(4)}|${offsetX}|${offsetY}`;
      const ctx = { s, offsetX, offsetY, exportW, layout };
      const currentIds = new Set();

      [...items]
        .filter((item) => item && item.visible !== false)
        .sort((a, b) => (Number(a.zIndex) || 0) - (Number(b.zIndex) || 0))
        .forEach((item, index) => {
          const id = item.id || `__idx_${index}_${item.type || 'item'}`;
          currentIds.add(id);
          const sig = `${positionKey}|${JSON.stringify(item)}`;
          const cached = itemElementCache.get(id);
          if (cached && cached.sig === sig) {
            root.appendChild(cached.el);
            return;
          }
          const el = buildItemElement(item, ctx);
          if (cached) cached.el.remove();
          itemElementCache.set(id, { el, sig });
          root.appendChild(el);
        });

      itemElementCache.forEach((entry, id) => {
        if (!currentIds.has(id)) {
          entry.el.remove();
          itemElementCache.delete(id);
        }
      });

      currentMenuData = layout;
      const hasJar = items.some((item) => item && item.type === 'gift-jar' && item.visible !== false);
      if (hasJar) {
        ensureOverlayGiftJarPhysics();
      } else if (overlayGiftJarPhysics) {
        overlayGiftJarPhysics.destroy();
        overlayGiftJarPhysics = null;
      }
    }

    let giftsLibrary = [];
    async function loadGiftsLibrary() {
      try {
        const res = await fetch('/api/tiktok/gifts-library');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            giftsLibrary = data;
          }
        }
      } catch (err) {
        console.error('Failed to load gifts library:', err);
      }
    }

    async function loadAndRender(force = false) {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('preview') === 'true') {
          if (document.body) {
            document.body.style.background = '#060d1f';
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              document.body.style.background = '#060d1f';
            });
          }
        }
        const layoutId = params.get('layoutId') || '';
        const userId = params.get('userId') || '';
        let url = `/api/tiktok/gift-menu-overlay-layout?t=${Date.now()}`;
        if (layoutId) url += `&layoutId=${layoutId}`;
        if (userId) url += `&userId=${userId}`;
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();
        consecutiveFetchFailures = 0;
        if (!(data && data.success && data.layout)) return;

        const layout = data.layout;
        const signature = JSON.stringify({
          savedAt: layout.savedAt || '',
          exportSize: layout.exportSize || null,
          items: layout.exportedItems || layout.items || []
        });
        if (!force && signature === lastLayoutSignature) return;

        lastLayoutSignature = signature;
        render(layout);
      } catch (err) {
        console.error('Error loading or rendering layout:', err);
        // fetch() only throws for a network-level failure (e.g. the LiveFlow
        // backend isn't running because the app was closed) — not for a
        // normal HTTP error status. Sustained failures mean nobody is
        // actively managing this overlay anymore, so clear it instead of
        // leaving the last board frozen on stream.
        consecutiveFetchFailures += 1;
        if (consecutiveFetchFailures === FETCH_FAILURES_BEFORE_CLEAR) {
          clearOverlayForDisconnect();
        }
      }
    }

    window.addEventListener('resize', () => loadAndRender(true));
    loadGiftsLibrary().then(() => {
      loadAndRender(true);
      setInterval(() => loadAndRender(false), 700);
    });

    let isSocketConnected = false;

    function setGiftMenuPlaybackVisibility(isPlaybackActive) {
      const root = document.getElementById('overlay-root');
      if (!root) {
        console.warn('[DEBUG] #overlay-root not found in DOM!');
        return;
      }
      console.log('[DEBUG] setGiftMenuPlaybackVisibility:', isPlaybackActive);
      root.classList.toggle('gmd-effect-playback-hidden', Boolean(isPlaybackActive));
    }

    function shouldFadeForPlayback(data) {
      const type = data && (data.playbackType || data.currentPlaybackType);
      const decision = type === 'live_mapping' || type === 'test_mapping' || type === 'preview_effect';
      console.log('[DEBUG] shouldFadeForPlayback: type =', type, 'decision =', decision, 'data =', data);
      return decision;
    }

    function showChallengeWheel(data) {
      const segments = Array.isArray(data?.segments) ? data.segments.filter((segment) => segment && segment.label) : [];
      if (segments.length < 2) return;
      document.getElementById('gmd-challenge-wheel-live')?.remove();
      const host = document.createElement('div');
      host.id = 'gmd-challenge-wheel-live';
      document.body.classList.add('gmd-live-wheel-active');
      const colors = segments.map((segment, index) => segment.color || ['#8b5cf6','#ec4899','#f59e0b','#06b6d4','#22c55e'][index % 5]);
      const step = 360 / segments.length;
      const gradient = segments.map((_, index) => `${colors[index]} ${index * step}deg ${(index + 1) * step}deg`).join(',');
      const resultIndex = Math.max(0, segments.findIndex((segment) => String(segment.id) === String(data.resultId)));
      const targetRotation = 360 * 6 + (360 - (resultIndex * step + step / 2));
      const safe = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
      const duration = Math.max(1500, Number(data.durationMs) || 6500);
      const hideAfter = Math.max(duration, Number(data.autoHideMs) || 7000);
      const resultVisual = data.resultImage ? `<img src="${safe(data.resultImage)}" alt="Kết quả" style="max-width:220px;max-height:140px;display:block;margin:0 auto 6px;border-radius:12px;object-fit:contain;">` : '';
      const presentation = data.presentation && typeof data.presentation === 'object' ? data.presentation : {};
      let staticWheel = document.querySelector('#overlay-root .gmd-static-challenge-wheel');
      if (!staticWheel && presentation.renderItem && window.MenuDesignerSharedRenderEngine?.renderByType) {
        // The active menu may not contain a wheel. Rebuild the saved mapping
        // snapshot with the exact same wrapper math used by the static overlay.
        const item = { ...presentation.renderItem, segments };
        const exportW = 1080;
        const exportH = 1920;
        const scale = Math.min(window.innerWidth / exportW, window.innerHeight / exportH) || 1;
        const offsetX = Math.round((window.innerWidth - (exportW * scale)) / 2);
        const offsetY = Math.round((window.innerHeight - (exportH * scale)) / 2);
        const refW = 720;
        const refH = 760;
        const boardWidth = Number(item.width || item.w) || refW;
        const boardHeight = Number(item.height || item.h) || refH;
        const wrapperScaleX = (boardWidth / refW) * scale;
        const wrapperScaleY = (boardHeight / refH) * scale;
        const savedWheel = document.createElement('div');
        savedWheel.className = 'gmd-item gmd-export-item';
        savedWheel.style.position = 'absolute';
        savedWheel.style.left = `${Math.round(offsetX + (Number(item.x) || 0) * scale)}px`;
        savedWheel.style.top = `${Math.round(offsetY + (Number(item.y) || 0) * scale)}px`;
        savedWheel.style.width = `${Math.round(boardWidth * scale)}px`;
        savedWheel.style.height = `${Math.round(boardHeight * scale)}px`;
        savedWheel.style.zIndex = String(Number(item.zIndex) || 1);
        const widgetHTML = window.MenuDesignerSharedRenderEngine.renderByType(
          item,
          { mode: 'overlay', scale: 1, apiBase: '', escapeText: true, gifts: giftsLibrary }
        );
        savedWheel.innerHTML = `<div class="gmd-visual-scaled-wrapper" style="width:${refW}px;height:${refH}px;transform:scale(${wrapperScaleX},${wrapperScaleY});transform-origin:top left;position:absolute;top:0;left:0;pointer-events:none;">${widgetHTML}</div>`;
        staticWheel = savedWheel;
      }
      if (staticWheel) {
        // Reuse the exact element already rendered from the saved OBS layout.
        // Rebuilding it with a second geometry calculation caused the mapping
        // test to appear smaller and at a different position.
        const liveWheel = staticWheel.cloneNode(true);
        liveWheel.classList.remove('gmd-static-challenge-wheel');
        liveWheel.classList.add('gmd-live-wheel-clone');
        liveWheel.style.visibility = 'visible';
        liveWheel.style.opacity = '1';
        const widget = liveWheel.querySelector('.gmd-challenge-wheel-widget');
        const disc = widget?.querySelector(':scope > div:last-child');
        const staticLabels = liveWheel.querySelectorAll('.gmd-wheel-static-labels span');
        if (disc) {
          disc.style.background = `conic-gradient(${gradient})`;
          disc.style.setProperty('transition', `transform ${duration}ms cubic-bezier(.12,.72,.08,1)`, 'important');
          disc.style.setProperty('transform', 'rotateX(12deg) rotateZ(0deg)', 'important');
        }
        staticLabels.forEach((label, index) => {
          if (segments[index]) label.textContent = segments[index].label;
        });
        const resultBox = document.createElement('div');
        resultBox.className = 'gmd-wheel-result';
        resultBox.innerHTML = `${resultVisual}Kết quả: <b>${safe(data.resultLabel || '')}</b>`;
        liveWheel.appendChild(resultBox);
        host.appendChild(liveWheel);
        document.body.appendChild(host);
        document.body.classList.add('gmd-live-wheel-active');
        window.setTimeout(() => {
          host.classList.add('is-spinning');
          disc?.style.setProperty('transform', `rotateX(12deg) rotateZ(${targetRotation}deg)`, 'important');
        }, 30);
        window.setTimeout(() => host.classList.add('is-finished'), duration);
        window.setTimeout(() => {
          host.remove();
          document.body.classList.remove('gmd-live-wheel-active');
        }, hideAfter + 500);
        return;
      }
      host.innerHTML = `<div class="gmd-wheel-backdrop"><div class="gmd-wheel-card"><div class="gmd-wheel-title">🎡 ${safe(data.title || 'VÒNG QUAY THỬ THÁCH')}</div><div class="gmd-wheel-subtitle">${safe(data.nickname || 'Khán giả')} tặng ${safe(data.giftName || 'quà')}</div><div class="gmd-wheel-pointer">▼</div><div class="gmd-wheel-disc" style="--wheel-gradient:conic-gradient(${gradient});--wheel-rotation:${targetRotation}deg;--wheel-duration:${duration}ms;"><div class="gmd-wheel-labels">${segments.map((segment, index) => { const angle = index * step + step / 2; const radialAngle = angle + 90; const readableAngle = radialAngle > 180 && radialAngle < 360 ? radialAngle + 180 : radialAngle; return `<span style="--i:${index};--count:${segments.length};--label-angle:${readableAngle}deg;">${safe(segment.label)}</span>`; }).join('')}</div><div class="gmd-wheel-center">QUAY</div></div><div class="gmd-wheel-result">${resultVisual}Kết quả: <b>${safe(data.resultLabel || '')}</b></div></div></div>`;
      const card = host.querySelector('.gmd-wheel-card');
      const backdrop = host.querySelector('.gmd-wheel-backdrop');
      const disc = host.querySelector('.gmd-wheel-disc');
      const pointer = host.querySelector('.gmd-wheel-pointer');
      const labels = host.querySelectorAll('.gmd-wheel-labels span');
      const labelSize = Math.max(10, Math.min(28, Number(presentation.labelFontSize) || 16));
      if (card) {
        // The live event already contains the wheel surface. Never add a
        // second rectangular board behind it; the wheel's own ring remains.
        // This also keeps older mappings (without presentation data) aligned
        // with the transparent designer preview.
        card.classList.add('gmd-wheel-card-transparent', 'gmd-wheel-no-border');
        card.style.setProperty('--wheel-border-color', presentation.borderColor || '#d6a84f');
        card.style.setProperty('--wheel-text-color', presentation.useCustomTextColor ? (presentation.textColor || '#ffffff') : '#ffffff');
        card.style.setProperty('--wheel-label-size', `${labelSize}px`);
        let boardX = Number(presentation.boardX);
        let boardY = Number(presentation.boardY);
        const boardWidth = Number(presentation.boardWidth);
        const boardHeight = Number(presentation.boardHeight);
        // Older saved wheel configurations stored the designer's stage
        // coordinates (9:16 stage is 720x960 with a 180x160 safe offset).
        // Convert those once at render time so old mappings line up with the
        // export canvas too; new saves are explicitly export-logical.
        if (presentation.coordinateSpace !== 'export-logical-v1'
          && Number.isFinite(boardX) && Number.isFinite(boardY)
          && boardWidth >= 500 && boardHeight >= 500) {
          boardX = Math.round((boardX - 180) * 3);
          boardY = Math.round((boardY - 160) * 3);
        }
        if (Number.isFinite(boardX) && Number.isFinite(boardY) && boardWidth > 0 && boardHeight > 0) {
          const exportW = 1080;
          const exportH = 1920;
          const positionScale = Math.min(window.innerWidth / exportW, window.innerHeight / exportH) || 1;
          // Keep the same centered export-canvas origin as the static
          // renderer. This matters when OBS uses a viewport whose aspect
          // ratio differs slightly from the 9:16 export canvas.
          const offsetX = Math.round((window.innerWidth - (exportW * positionScale)) / 2);
          const offsetY = Math.round((window.innerHeight - (exportH * positionScale)) / 2);
          card.style.width = `${boardWidth * positionScale}px`;
          card.style.height = `${boardHeight * positionScale}px`;
          card.style.boxSizing = 'border-box';
          card.style.display = 'grid';
          card.style.placeItems = 'center';
          card.style.position = 'absolute';
          card.style.left = `${offsetX + boardX * positionScale}px`;
          card.style.top = `${offsetY + boardY * positionScale}px`;
          card.style.transformOrigin = 'top left';
          // The saved board coordinates already describe the final canvas
          // position. Disable the entrance scale animation here; scaling the
          // positioning box changes its visual center and shifts the wheel.
          card.style.transform = 'none';
          card.style.transition = 'none';
        }
      }
      if (disc) {
        // Keep the live wheel's layered ring identical to the Designer skin:
        // white inner rim, red outer rim, gold accent and 3D lower shadow.
        disc.classList.add('gmd-live-wheel-disc');
        disc.style.border = '14px solid #f8fafc';
        disc.style.boxShadow = '0 0 0 5px #fbbf24, 0 0 0 14px #ef2029, 0 0 0 20px #fbbf24, 0 8px 0 22px #991b1b, 0 0 34px #ef4444aa';
        disc.style.filter = 'drop-shadow(0 0 12px rgba(251,191,36,.75))';
      }
      labels.forEach((label, index) => {
        const angle = index * step + step / 2;
        const radians = (angle - 90) * Math.PI / 180;
        const radialAngle = angle + 90;
        const readableAngle = radialAngle > 180 && radialAngle < 360 ? radialAngle + 180 : radialAngle;
        label.style.left = `${50 + Math.cos(radians) * 29}%`;
        label.style.top = `${50 + Math.sin(radians) * 29}%`;
        label.style.width = '22%';
        label.style.maxWidth = '22%';
        label.style.fontSize = `${labelSize}px`;
        label.style.transform = `translate(-50%,-50%) rotate(${readableAngle}deg)`;
      });
      if (disc) disc.style.setProperty('--wheel-label-size', `${labelSize}px`);
      if (disc && (Number(presentation.boardWidth) > 0 || Number(presentation.boardHeight) > 0)) {
        const boardWidth = Number(presentation.boardWidth) || 0;
        const boardHeight = Number(presentation.boardHeight) || 0;
        const configuredDisc = boardWidth > 0 ? boardWidth * 0.78 : boardHeight * 0.62;
        const maxByHeight = boardHeight > 0 ? boardHeight * 0.72 : configuredDisc;
        // Match the same logical-to-viewport conversion used by the static
        // layout renderer (1080x1920 export canvas). The saved dimensions are
        // logical Designer pixels, so convert them exactly once here.
        const exportW = 1080;
        const exportH = 1920;
        const viewportScale = Math.min(window.innerWidth / exportW, window.innerHeight / exportH) || 1;
        const discSize = Math.max(40, Math.min(configuredDisc, maxByHeight) * viewportScale);
        disc.style.width = `${discSize}px`;
        disc.style.maxWidth = 'none';
        // The live card is transparent and only acts as a positioning box.
        // Anchor the pointer to the actual wheel top, not to the card top;
        // otherwise a tall saved board makes the pointer visibly drift.
        if (pointer) {
          const cardHeight = boardHeight > 0 ? boardHeight * viewportScale : discSize;
          pointer.style.left = '50%';
          pointer.style.top = `${Math.max(0, (cardHeight - discSize) / 2 - (24 * viewportScale))}px`;
          pointer.style.transform = 'translateX(-50%)';
        }
      }
      document.body.appendChild(host);
      window.setTimeout(() => host.classList.add('is-spinning'), 30);
      window.setTimeout(() => host.classList.add('is-finished'), duration);
      window.setTimeout(() => {
        host.remove();
        document.body.classList.remove('gmd-live-wheel-active');
      }, hideAfter + 500);
    }

    async function syncGiftMenuPlaybackVisibility() {
      try {
        console.log('[DEBUG] syncGiftMenuPlaybackVisibility fetching...');
        const res = await fetch('/api/queue/status', { cache: 'no-store' });
        if (!res.ok) {
          console.error('[DEBUG] fetch status not OK:', res.status);
          return setGiftMenuPlaybackVisibility(false);
        }
        const status = await res.json();
        const active = status.status === 'playing' && shouldFadeForPlayback(status);
        console.log('[DEBUG] sync status result:', status, 'active =', active);
        setGiftMenuPlaybackVisibility(active);
      } catch (err) {
        console.error('[DEBUG] sync status error:', err);
        setGiftMenuPlaybackVisibility(false);
      }
    }

    let overlayGiftJarPhysics = null;
    let currentMenuData = null;

    function ensureOverlayGiftJarPhysics() {
      if (typeof window.GiftJarPhysics === 'function') {
        const root = document.getElementById('overlay-root') || document.body;
        if (!overlayGiftJarPhysics || overlayGiftJarPhysics.container !== root) {
          if (overlayGiftJarPhysics) overlayGiftJarPhysics.destroy();
          overlayGiftJarPhysics = new window.GiftJarPhysics(root, {
            autoResize: true,
            getItem: () => {
              const items = currentMenuData?.exportedItems || currentMenuData?.items || [];
              return items.find(e => e.type === 'gift-jar') || null;
            }
          });
        }
        if (overlayGiftJarPhysics) {
          overlayGiftJarPhysics.setupWalls();
        }
      }
      return overlayGiftJarPhysics;
    }

    function triggerGiftJarDrop(data) {
      const physics = ensureOverlayGiftJarPhysics();
      const coins = Number(data.coins) || 10;
      
      if (physics) {
        if (data.rankBadge) {
          physics.spawnTopDonorBadge(1, data.nickname || 'Top 1 Supporter');
        } else if (coins > 500) {
          physics.spawnLion();
        } else if (coins > 100) {
          if (Math.random() < 0.5) physics.spawnGalaxy();
          else physics.spawnMoneyGun();
        } else if (coins > 10) {
          if (Math.random() < 0.5) physics.spawnDiamond(2);
          else physics.spawnCorgi();
        } else {
          physics.spawnRose(Math.min(15, Math.max(3, coins)));
        }
      }
    }

    function connectGiftMenuPlaybackSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsToken = new URLSearchParams(window.location.search).get('wsToken') || '';
      const wsUrl = `${protocol}//${window.location.hostname || 'localhost'}:9001?token=${encodeURIComponent(wsToken)}`;
      console.log('[DEBUG] connectGiftMenuPlaybackSocket to:', wsUrl);
      const socket = new WebSocket(wsUrl);

      socket.addEventListener('open', () => {
        isSocketConnected = true;
        console.log('[DEBUG] socket open');
        syncGiftMenuPlaybackVisibility();
      });
      socket.addEventListener('message', (message) => {
        try {
          const packet = JSON.parse(message.data || '{}');
          console.log('[DEBUG] socket packet:', packet);
          if (packet.event === 'effect_playback_started' && shouldFadeForPlayback(packet.data)) {
            setGiftMenuPlaybackVisibility(true);
          } else if (packet.event === 'effect_player_play_request' && shouldFadeForPlayback(packet.data)) {
            setGiftMenuPlaybackVisibility(true);
          } else if (packet.event === 'effect_playback_finished' && shouldFadeForPlayback(packet.data) && !Number(packet.data?.queueLength || 0)) {
            setGiftMenuPlaybackVisibility(false);
          } else if (packet.event === 'effect_player_play_finished' || packet.event === 'effect_player_play_failed') {
            syncGiftMenuPlaybackVisibility();
          } else if (packet.event === 'challenge_wheel_spin') {
            showChallengeWheel(packet.data || {});
          } else if (packet.event === 'gift_jar_drop') {
            triggerGiftJarDrop(packet.data || {});
          } else if (packet.event === 'effect_queue_empty') {
            setGiftMenuPlaybackVisibility(false);
          }
        } catch (_error) {
          console.error('[DEBUG] socket message error:', _error);
        }
      });
      socket.addEventListener('close', () => {
        isSocketConnected = false;
        console.log('[DEBUG] socket close');
        syncGiftMenuPlaybackVisibility();
        window.setTimeout(connectGiftMenuPlaybackSocket, 3000);
      });
      socket.addEventListener('error', (err) => {
        console.error('[DEBUG] socket error:', err);
      });
    }

    syncGiftMenuPlaybackVisibility();
    connectGiftMenuPlaybackSocket();

    // Polling fallback
    setInterval(() => {
      if (!isSocketConnected) {
        syncGiftMenuPlaybackVisibility();
      }
    }, 800);
  </script>
</body>
</html>
