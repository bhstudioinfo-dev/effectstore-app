<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gift Menu Overlay</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #overlay-root { position: relative; width: 100vw; height: 100vh; background: transparent; }
    .ov-item { position: absolute; display: inline-flex; flex-direction: column; align-items: center; transform-origin: center center; }
    .ov-visual { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .ov-visual img { width: 100%; height: 100%; object-fit: contain; z-index: 2; position: relative; }
    .ov-visual::before, .ov-visual::after { content: ""; position: absolute; inset: -10%; border-radius: var(--aura-shape, 50%); pointer-events: none; }
    .ov-label { padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); text-shadow: 0 2px 8px rgba(0,0,0,.6); font-weight: 700; white-space: nowrap; }
    .aura-glow::before { box-shadow: 0 0 26px 8px color-mix(in srgb, var(--aura-color, #c084fc) 60%, transparent); }
    .aura-bubble::before { background: color-mix(in srgb, var(--aura-color, #c084fc) 28%, transparent); border: 1px solid color-mix(in srgb, var(--aura-color, #c084fc) 65%, white 35%); }
    .aura-ring::before { border: 2px solid color-mix(in srgb, var(--aura-color, #c084fc) 80%, white 20%); animation: ovSpin calc(var(--anim-speed, 1s) * 4) linear infinite; }
    .aura-frame::before { border: 2px solid color-mix(in srgb, var(--aura-color, #c084fc) 90%, white 10%); box-shadow: 0 0 16px color-mix(in srgb, var(--aura-color, #c084fc) 80%, transparent); border-radius: 12px; }
    .aura-sweep::before { border: 1px solid color-mix(in srgb, var(--aura-color, #c084fc) 80%, white 20%); }
    .aura-sweep::after { background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,.6) 48%, transparent 90%); transform: translateX(-140%); animation: ovSweep calc(var(--anim-speed, 1s) * 2.4) linear infinite; }
    .anim-pulse { animation: ovPulse var(--anim-speed, 1s) ease-in-out infinite; }
    .anim-bounce { animation: ovBounce var(--anim-speed, 1s) ease-in-out infinite; }
    .anim-float { animation: ovFloat var(--anim-speed, 1s) ease-in-out infinite; }
    .anim-zoom { animation: ovZoom var(--anim-speed, 1s) ease-in-out infinite; }
    .anim-shake { animation: ovShake var(--anim-speed, 1s) ease-in-out infinite; }
    .anim-sweep::after { animation: ovSweep calc(var(--anim-speed, 1s) * 2.2) linear infinite; }
    @keyframes ovPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes ovBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes ovFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes ovZoom { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    @keyframes ovShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
    @keyframes ovSpin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes ovSweep { from{transform:translateX(-140%)} to{transform:translateX(140%)} }
  </style>
</head>
<body>
  <div id="overlay-root"></div>
  <script>
    const root = document.getElementById('overlay-root');
    const overlayMap = { Glow:'aura-glow', Bubble:'aura-bubble', 'Magic Ring':'aura-ring', 'Neon Frame':'aura-frame', 'Light Sweep':'aura-sweep' };
    const motionMap = { Pulse:'anim-pulse', Bounce:'anim-bounce', Float:'anim-float', Zoom:'anim-zoom', Shake:'anim-shake', 'Light Sweep':'anim-sweep' };
    function shapeValue(shape){ return shape === 'Oval' ? '50% / 38%' : '50%'; }

    function render(layout) {
      const items = Array.isArray(layout.items) ? layout.items : [];
      const cw = (layout.canvasSize && layout.canvasSize.width) || 720;
      const ch = (layout.canvasSize && layout.canvasSize.height) || 960;
      const sx = window.innerWidth / cw;
      const sy = window.innerHeight / ch;
      root.innerHTML = '';

      items.sort((a,b)=>(a.zIndex||0)-(b.zIndex||0)).forEach((item) => {
        const el = document.createElement('div');
        const left = (Number(item.x)||0) * sx;
        const top = (Number(item.y)||0) * sy;
        const width = (Number(item.width)||84) * sx;
        const height = (Number(item.height)||84) * sy;
        el.className = 'ov-item';
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.transform = `rotate(${Number(item.rotation)||0}deg)`;
        el.style.zIndex = String(item.zIndex || 1);
        const aura = overlayMap[item.auraType] || '';
        const motion = motionMap[item.animationType] || '';
        const speed = Math.max(0.2, Number(item.animationSpeed) || 1);
        const label = item.showName ? `<div class="ov-label" style="margin-top:${Number(item.textGap)||6}px;font-size:${(Number(item.textSize)||13) * ((sx+sy)/2)}px;color:${item.textColor||'#fff'};">${item.name||''}</div>` : '';
        el.innerHTML = `
          <div class="ov-visual ${aura} ${motion}" style="--aura-color:${item.auraColor||'#c084fc'};--aura-shape:${shapeValue(item.auraShape)};--anim-speed:${speed}s;">
            <img src="${item.iconUrl || ''}" alt="${item.name || ''}">
          </div>
          ${label}
        `;
        root.appendChild(el);
      });
    }

    async function loadAndRender() {
      try {
        const res = await fetch('/api/tiktok/gift-menu-layout');
        const data = await res.json();
        if (data && data.success && data.layout) render(data.layout);
      } catch (_) {}
    }

    window.addEventListener('resize', loadAndRender);
    loadAndRender();
    setInterval(loadAndRender, 2500);
  </script>
</body>
</html>
